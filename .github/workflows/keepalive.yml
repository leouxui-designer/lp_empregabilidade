# Mantém o projeto Supabase (plano Free) ativo: uma consulta leve à tabela pins a cada 3 dias.
# Usa só a chave pública, a mesma que já está no site.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar a API
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://weagqjejgswumhpibuco.supabase.co/rest/v1/pins?select=id&limit=1' \
            -H 'apikey: sb_publishable_3qOHIwEKudAWzkC2DSSEYA_Nt2ke20V')
          echo "HTTP $status"
          test "$status" = "200"
